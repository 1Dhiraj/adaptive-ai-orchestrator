apiVersion: v1
kind: Namespace
metadata: {name: adaptive-orchestrator}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: orchestrator-config, namespace: adaptive-orchestrator}
data:
  ORCHESTRATOR_BROKER_URL: redis://redis.example.internal:6379/0
  ORCHESTRATOR_RESULT_BACKEND: redis://redis.example.internal:6379/1
  ORCHESTRATOR_SECRET_BACKEND: aws
  ORCHESTRATOR_AWS_SECRET_ID: adaptive-orchestrator
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring:4317
---
apiVersion: batch/v1
kind: Job
metadata: {name: orchestrator-migrate, namespace: adaptive-orchestrator}
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/replace-me/adaptive-orchestrator:latest
          command: ["alembic"]
          args: ["upgrade", "head"]
          envFrom:
            - configMapRef: {name: orchestrator-config}
            - secretRef: {name: orchestrator-runtime}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: adaptive-orchestrator}
spec:
  replicas: 2
  selector: {matchLabels: {app: orchestrator-api}}
  template:
    metadata: {labels: {app: orchestrator-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/replace-me/adaptive-orchestrator:latest
          command: ["python"]
          args: ["-m", "orchestrator.cli", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: orchestrator-config}
            - secretRef: {name: orchestrator-runtime}
          readinessProbe: {httpGet: {path: /api/health, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 8000}, initialDelaySeconds: 20}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: workspace, mountPath: /app/workspace}]
      volumes: [{name: tmp, emptyDir: {}}, {name: workspace, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: adaptive-orchestrator}
spec:
  replicas: 2
  selector: {matchLabels: {app: orchestrator-worker}}
  template:
    metadata: {labels: {app: orchestrator-worker}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/replace-me/adaptive-orchestrator:latest
          command: ["celery"]
          args: ["-A", "orchestrator.distributed:app", "worker", "-Q", "workflows", "--concurrency=2"]
          envFrom:
            - configMapRef: {name: orchestrator-config}
            - secretRef: {name: orchestrator-runtime}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: browser-worker, namespace: adaptive-orchestrator}
spec:
  replicas: 1
  selector: {matchLabels: {app: orchestrator-browser-worker}}
  template:
    metadata: {labels: {app: orchestrator-browser-worker}}
    spec:
      containers:
        - name: browser-worker
          image: ghcr.io/replace-me/adaptive-orchestrator-playwright:latest
          command: ["celery"]
          args: ["-A", "orchestrator.distributed:app", "worker", "-Q", "browser", "--concurrency=1"]
          envFrom:
            - configMapRef: {name: orchestrator-config}
            - secretRef: {name: orchestrator-runtime}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: adaptive-orchestrator}
spec: {selector: {app: orchestrator-api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: worker, namespace: adaptive-orchestrator}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker}
  minReplicas: 2
  maxReplicas: 20
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
